services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: taskflow-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow_db
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    networks:
      - taskflow-network

  # Cache Service
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    networks:
      - taskflow-network

  # Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      - DIRECT_URL=postgresql://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=taskflow_user
      - DB_PASSWORD=taskflow_password
      - DB_NAME=taskflow_db
      - JWT_SECRET=supersecretkey_dev_only
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - taskflow-network

  # Frontend Service
  web:
    build:
      context: ../vue/taskflow
      dockerfile: Dockerfile
    container_name: taskflow-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - api
    volumes:
      - ../vue/taskflow:/app
      - /app/node_modules
    networks:
      - taskflow-network

volumes:
  postgres_data_v2:

networks:
  taskflow-network:
    driver: bridge
